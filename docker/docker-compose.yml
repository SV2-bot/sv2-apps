services:
  pool_sv2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: pool_sv2
    image: pool_sv2:hotpath
    container_name: pool_sv2
    stop_signal: SIGINT
    network_mode: host
    environment:
      - HOTPATH_METRICS_PORT=6781
      - HOTPATH_MCP_PORT=6791
    volumes:
      - "${CONFIG_POOL}/pool-config.toml:/app/pool-config.toml:ro"
      - "${BITCOIN_SOCKET_PATH}:/root/.bitcoin/node.sock"
      - "${BITCOIN_IPC_DIR}:/root/.bitcoin"
      - "${DATA_POOL}:/app/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  jd_client_sv2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: jd_client_sv2
    image: jd_client_sv2:hotpath
    container_name: jd_client_sv2
    stop_signal: SIGINT
    network_mode: host
    environment:
      - HOTPATH_METRICS_PORT=6782
      - HOTPATH_MCP_PORT=6792
    volumes:
      - "${CONFIG_JDC}/jdc-config.toml:/app/jdc-config.toml:ro"
      - "${BITCOIN_SOCKET_PATH}:/root/.bitcoin/node.sock"
      - "${BITCOIN_IPC_DIR}:/root/.bitcoin"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  translator_sv2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: translator_sv2
    image: translator_sv2:hotpath
    container_name: translator_sv2
    stop_signal: SIGINT
    network_mode: host
    environment:
      - HOTPATH_METRICS_PORT=6783
      - HOTPATH_MCP_PORT=6793
    volumes:
      - "${CONFIG_TPROXY}/translator-config.toml:/app/translator-config.toml:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9092/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  sv2_apps:
